[project]
name = "jquantster"
version = "0.1.0"
description = "Rate-limited J-Quants (JPX) fetcher with SQLite storage and a Streamlit dashboard"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "streamlit>=1.40",
    "altair>=5",
    "python-dotenv>=1.0",
]

[project.scripts]
jquantster = "jquantster.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jquantster"]

[tool.pytest.ini_options]
pythonpath = ["src"]
